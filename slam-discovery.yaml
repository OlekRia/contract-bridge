  evidence_rule: >-
    Historical analyses can contain contradictory 'cold' versus 'on a finesse'
    descriptions. Check the actual cards and evidence. Cite an external source
    for a proposed convention, but never treat it as authority for our agreements.

system_snapshot:
  first_second_seat:
    opening_1C: "Usually 5+; 4 only with 15+ balanced 3=3=3=4, per current specification."
    opening_1D: "4+; often 5+, with strong balanced exceptions documented separately."
    balanced_12_14: "Normally open 1NT, not a minor. Check opening eligibility first."
    response_1C_1D: "4+ diamonds; explicit exception to the five-card new-suit rule."
    response_1m_1M: "5+ major, regardless of responder strength; DEC-6."
    response_1NT: "6–12, forcing one round; no fit and no available one-level new suit."
    response_1D_2C: "13+, 5+ clubs, GF; not generic four-card 2♣."
    single_minor_raise: "6–9, 3+ support; verify an actual fit given short-minor exceptions."
    jump_minor_raise: "10–12, 5+ support, invitational; specific rule overrides generic raise text."
    response_2NT: "11–12 balanced, natural invitation."
    jump_new_major: "16+, 5+ self-sufficient suit, GF strong jump shift."
    jump_other_minor: "10–12, 5+ suit, invitational."
  third_fourth_seat:
    minors: "Best minor, possibly three cards; 12–14 balanced can open a minor."
    responder: "Passed hand; forcing 1NT and automatic 2/1 GF are OFF."
    one_level_new_suit: "4+ instead of the first/second-seat five-card-major promise."
    audit: "Do not put an ordinary 16+ HCP strong-jump-shift hand in a passed-hand example."
  established_2_1_gf:
    fourth_suit: "Natural, 4+; R-BID-045, DEC-14."
    controls: "First-round ace/void controls up the line; R-BID-047."
    keycards: "4NT RKCB 30-41-22 (3014), per AMD-32/AMD-33, after agreed trumps and a safety check."
    responses: {"5♣": "3 or 0", "5♦": "4 or 1", "5♥": "2 without trump queen", "5♠": "2 with trump queen"}
    minor_game: "Prefer 3NT unless justified by stopper problems, shape or slam prospects; R-BID-048."

mandatory_audit:
  - id: G01
    issue: "13+ with only four-card majors and no legal natural GF response."
    task: >-
      Test both minor openings, with and without support. Forcing 1NT stops at
      12; 1M promises five; 1♦–2♣ requires five clubs. Enumerate the uncovered
      shapes and compare a minimal fix against keeping every current meaning.
  - id: G02
    issue: "Strong direct minor support and establishing a force after 1♣."
    task: >-
      2m is a weak raise and 3m invitational, so neither is an inverted GF raise.
      Show when a genuine new suit followed by support works and when no such
      suit exists. Distinguish 1♣–2♦, a jump in the other minor, from 1♦–2♣.
  - id: G03
    issue: "One-level auctions and incompletely defined fourth-suit forcing."
    task: >-
      The verbose text mentions artificial fourth suit outside 2/1 GF but does
      not fully define its level, duration or continuations. Audit sequences
      such as 1♣–1♦; 1♥–1♠ and 1♦–1♠; 2♣–2♥. Do not automatically call every
      fourth suit GF, or export the 2/1 natural rule to every forcing auction.
  - id: G04
    issue: "Conflicting response lengths and overly broad GF wording."
    task: >-
      available_2_1_bids.after_1C says one-level responses may have four cards;
      the dedicated response rule and DEC-6 require five-card majors. Apply
      source priority explicitly. Reconcile 'new suit at the two-level is GF'
      with the specific invitational jump-in-other-minor treatment.
  - id: G05
    issue: "Incorrect bypass and void examples in cuebid_slam."
    task: >-
      3♥–3♠ does not bypass a diamond control bid; 4♦ is still ahead. Also,
      partner's lack of control opposite your void does not create two immediate
      losers in that suit. Preserve the ratified first-round principle while
      flagging these illustrations and writing accurate replacement examples.
  - id: G06
    issue: "Scope of slam machinery outside established 2/1 GF."
    task: >-
      Audit whether control bids, fit-setting raises, fast arrival, 4m, queen
      asks, king asks, 5NT and void responses are defined after one-over-one,
      strong jump shifts and forcing-1NT starts. Give exact proposals for missing
      meanings; do not turn a natural new suit into a control bid without a trigger.
  - id: G07
    issue: "NT rebid ranges and continuation collisions."
    task: >-
      Check 1m–1x–2NT against 1♦–2♣–2NT/3NT. Do not invent an 18–19 jump-NT
      range. Audit whether the 12–14 balanced 2/1 branch is reachable when such
      opener hands normally open 1NT. Flag any contradiction instead of building
      an example that violates the opening system.
  - id: G08
    issue: "Premature 3NT, unsafe 4NT and ambiguous four-of-a-minor."
    task: >-
      Define which return to a minor is natural, forcing, invitational, fit-setting
      or a proposed keycard ask in each sequence. Address reopening after 3NT
      and how a natural NT rebid interacts with a previously shown fit.

methods_to_compare:
  existing_first:
    - "Natural shape discovery, delayed support and strong jump shifts"
    - "Forcing status, reverses and space preservation; audit exact meanings"
    - "HCP plus fit, controls, working honours, trick sources and qualified LTC/NLTC"
    - "First-round control bids, RKCB 30-41-22 and quantitative NT invitations"
  candidates_only_if_a_gap_requires_them:
    - "Precisely scoped fourth-suit forcing outside the existing 2/1 GF rule"
    - "Checkback/new-minor forcing after natural NT rebids, with exact triggers"
    - "Inverted minor raises or another GF minor-support route; show displaced weak raises"
    - "Splinters and shortness discovery; preserve our existing strong major jump shifts"
    - "Mixed first-/second-round control bids; explicitly changes R-BID-047"
    - "Minorwood versus Kickback versus retaining 4NT with a strict safety check"
    - "Serious/non-serious 3NT only where fit and auction make it useful"
    - "Exclusion keycard for a useful void, if ordinary controls cannot solve the problem"
    - "Trump-queen and specific side-king asks with complete signoff rules"
  collision_requirement: >-
    For any repurposed call, list all affected existing sequences and provide
    an alternative route for hands that previously used it. Do not install
    several incompatible meanings on 4♣/4♦ or call 4♣ Gerber by default.

hand_coverage:
  minimum_worked_examples: 28
  minimum_per_minor_opening: 12
  minimum_justified_no_slam_examples: 8
  minimum_matched_pairs: 4
  matched_pair_rule: >-
    Change one meaningful feature while retaining two valid, disjoint 13-card
    hands: useful/wasted honours, good/poor trumps, working/misfitting side suit,
    or minimum/maximum strength. Show why the decision changes or stays the same.
  required_cases:
    - "Minimum unbalanced opener opposite a powerful responder with minor support"
    - "Strong opener opposite an invitational responder; opener initiates the try"
    - "Balanced strong hands with no fit: quantitative invitation accepted"
    - "Balanced quantitative invitation declined by a minimum"
    - "Long solid clubs generating tricks below a mechanical 33-HCP threshold"
    - "Long solid diamonds generating tricks below a mechanical 33-HCP threshold"
    - "Long broken minor with similar HCP but inadequate trump texture"
    - "5–5 minors or a minor double fit; controls versus wasted major honours"
    - "Minor-major two-suiter; discovered 5–3 major fit"
    - "A 4–4 major fit after a minor opening; expose response-map gaps"
    - "Six- or seven-card responder major; compare slow bidding and strong jump shift"
    - "1♣–1♦ start with four diamonds; genuine delayed club support"
    - "1♦–2♣ GF start; eventual clubs, diamonds or NT as distinct branches"
    - "Forcing-1NT start with 10–12; avoid quietly inventing a GF"
    - "13–15 with four-card majors only and no five-card clubs after 1♦"
    - "GF club support after 1♣ with no legal one-level new suit"
    - "Singleton producing a useful ruff and fitting side-suit honours"
    - "Honours wasted opposite a singleton; downgrade despite similar HCP"
    - "Useful void; ambiguity of ordinary keycard asking"
    - "High combined HCP but two cashing side-suit losers; stop"
    - "Missing two keycards discovered before committing beyond a safe game"
    - "One missing keycard and uncertain trump queen; assess the real trump holding"
    - "Club RKCB response bypasses 5♣; show prevention rather than an illegal retreat"
    - "Diamond RKCB response bypasses 5♦; show prevention or prior safety evidence"
    - "6m has ruffing tricks while 6NT lacks twelve winners"
    - "All five keycards but no thirteenth trick; stop in six"
    - "Grand slam with an identifiable thirteenth trick and adequate trump control"
    - "Third/fourth-seat short-minor opening and a passed responder; no automatic GF"

