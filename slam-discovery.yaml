# Give Claude this entire YAML file with access to the repository.
# This is a research/teaching prompt, not a ratified convention-card amendment.
title: "All Fives — Slam Discovery in Uncontested Auctions"
version: 1
language: English
status: research_prompt
scope:
  overall: "Build an opening-by-opening guide to discovering small and grand slams."
  current_chapter: "After natural 1♣ and 1♦ openings"
  auction: "One-way bidding: both opponents pass throughout."
  default: "Opener in first/second seat; responder unpassed."
  variations: "Separate third/fourth-seat openings and passed-hand responses."
  destinations: ["6♣", "6♦", "6♥", "6♠", "6NT", "7♣", "7♦", "7♥", "7♠", "7NT"]
  successful_stops: ["partscore", "3NT", "4♥", "4♠", "5♣", "5♦", "6 instead of 7"]
  future_chapters: >-
    Inventory every other opening actually present in the current specification,
    including seat-dependent NT, Benji, weak/preemptive, UCM and specific-ace
    openings. Give each a roadmap entry using the same discovery framework.
    Fully develop the 1-minor chapter now; do not pretend the later chapters
    are complete or import their special responses into 1-minor auctions.

claude_prompt: |
  Act as the Fermat Institute's Principal Investigator and our All Fives
  partnership bidding coach. Produce a practical, comprehensive chapter:
  "How we discover slam after opening 1♣ or 1♦."

  Read this entire YAML as your assignment, including its source inventory,
  system constraints, audit questions, hand matrix and seed deals. Explain
  how the partnership discovers slam potential from the first response,
  rather than merely describing Blackwood once a fit has already been found.
  The goal is repeatable partnership decisions: find worthwhile slams, reject
  poor ones, choose the right strain, and preserve a safe stopping place.

  Begin by reading the current repository sources. Apply the Constitution's
  authority hierarchy, then lex specialis and lex posterior. Cite actual
  paths, YAML sections and applicable F-/R-/DEC-/H-IDs. Distinguish ratified
  agreements from active investigations and from historical rejected ideas.
  Source snapshots below are navigation aids; recheck them against live files.

  Use three explicit labels throughout:
  CURRENT AGREEMENT — supported by an applicable authoritative source.
  GAP / CONFLICT — missing, ambiguous, inconsistent or impossible as written.
  PROPOSAL — a precise new agreement that requires partnership adoption.
  Never smooth over a gap by inventing a forcing bid. If a worked hand cannot
  be bid unambiguously, stop its CURRENT auction at the first missing agreement
  and give a separately labelled PROPOSED continuation through the final contract.
  Do the complete analysis and present concrete proposals for review; this
  assignment does not ratify them or authorize rewriting governance/system files.

  First build a response map separately for 1♣ and 1♦. Partition responder's
  hands by strength (weak, invitational, GF, slam interest), shape, minor support,
  five-card major, four-card major, long minor and passed/unpassed status.
  For every branch state its first call, minimum length, strength, forcing
  status and route to the next informative call. Expose uncovered hand types.
  A 1♣ opening has no non-jump new-suit 2/1 response: do not manufacture one.
  The documented non-jump 2/1 over 1♦ is 2♣; it promises five clubs here.

  Then follow each useful first response through opener's rebid and responder's
  next action. Cover minimum suit rebids, second suits, major raises, reverses,
  jump rebids, balanced rebids and strong jump shifts. Distinguish ranges by
  the exact auction: a 2NT rebid after a one-level/forcing-1NT response is not
  automatically the same as 2NT inside an established 2/1 GF. Audit ranges and
  opening eligibility, especially balanced 12–14 and 18–21 hands. Where the
  sources omit a continuation or range, record a gap rather than importing Acol,
  SAYC or generic 2/1 defaults.

  For every route, answer in order:
  1. What makes either player suspect slam: extras, controls, a long source of
     tricks, a double fit, useful shortness, or exceptionally good trumps?
  2. Which call keeps the auction alive, and is it one-round forcing or GF?
  3. How are shape, fit and working honours discovered without wasting space?
  4. Which bid actually agrees trumps? Who knows the fit, and does partner know?
  5. Which side suits are controlled, and can defenders cash two quick tricks?
  6. Is there a credible route to twelve tricks, including trump quality,
     entries, ruffs, discards and establishment of a side suit?
  7. Which question still matters, who should ask it, and can we afford every
     possible answer before committing to 4NT or another asking bid?
  8. Should we stop, bid a small slam, or investigate a thirteenth trick?

  Evaluate both hands independently before revealing partner's cards. Use
  HCP, aces/kings, working versus wasted honours, fit length, shape, source of
  tricks and qualified LTC/NLTC analysis. The 33/37 HCP guidelines and
  24-minus-combined-losers estimate are prompts to investigate, not guarantees.
  Do not use LTC as a substitute for NT winners or before establishing a fit.
  Demonstrate low-HCP slams and high-HCP hands with fatal control weaknesses.
  Re-evaluate honours opposite both shortness and length; do not double-count
  distribution, ruffing tricks and long-suit winners.

  Explain current first-round control bidding before comparing alternatives.
  A king or singleton is a second-round control and must not silently be shown
  as an ace/void under our current agreement. Infer a denial only from a control
  bid that actually bypasses a cheaper, available control-showing call. Show
  an actual legal auction for each inference. A denial of first-round control
  is not proof of two immediate losers: combine both hands' information.

  Explain our RKCB 30-41-22 with the four aces plus the agreed trump king:
  5♣ = 3/0, 5♦ = 4/1, 5♥ = two without the trump queen, 5♠ = two with it.
  This is the 3014 mapping confirmed in AMD-32/AMD-33, not 1430. Enumerate
  responses, resolve 3/0 and 4/1 ambiguity using information legitimately known
  to the asker, and consider the trump queen. Separate a useful void from an
  ace: a void is not an extra keycard. Explain why asking with a void can leave
  the identity of a missing useful ace unresolved. Do not promise that all
  keycards imply twelve or thirteen tricks.

  Give a response-by-response safety table for clubs and diamonds as trumps.
  For each of 5♣/5♦/5♥/5♠, say whether the original five-of-trumps stopping
  place is still available, which keycard holdings can make that response bad,
  and what the asker must know before using 4NT. Include a clubs example where
  5♦ already makes a return to 5♣ impossible, and examples where 5♥/5♠ bypass
  5♦. Never show a descending bid or claim that 5m remains available afterward.
  If 4NT is unsafe, show the current control-bidding route or identify the
  missing agreement; compare one economical alternative as a proposal.

  Give a context table for 4NT: quantitative after appropriate natural NT
  sequences without agreed trumps; RKCB with agreed trumps where documented;
  unresolved where the system does not settle the meaning. Address auctions
  with a previously shown minor fit followed by 3NT explicitly. A quantitative
  invitation can be passed; an RKCB ask cannot. Do not decide the meaning solely
  from the immediately preceding call or from the last suit mentioned.

  Discuss queen asks, side-king asks, 5NT, grand-slam exploration and void
  treatments only with explicit status labels. If undocumented, give a complete
  candidate agreement with triggers, answers, signoffs and conflicts. A grand
  slam needs a credible thirteenth trick, sound trumps and sufficient controls;
  specify any remaining finesse or break dependency. Include a case with all
  five keycards that correctly stops in six.

  Compare 3NT, 5m, 6m, 6M and 6NT using actual trick sources, stoppers, entries,
  lead exposure, trump fits, scoring and vulnerability. Preserve the system's
  preference for 3NT when there is no reason to leave it, while explaining when
  a genuine slam investigation justifies passing 3NT. Show 6m making through
  ruffs when 6NT has insufficient winners. Distinguish IMP and matchpoint
  judgments; derive any numerical break-even claim from the specified outcomes.

  Recommend the smallest coherent set of improvements. For each candidate
  method explain the exact gap it fills, auction cost, displaced meanings,
  memory burden, gain/loss cases and falsifiable validation plan. Rank candidates
  as needed now, optional later, or unsuitable. Prefer solving an evidenced gap
  over adding a catalogue of fashionable conventions. Keep the full CURRENT
  and PROPOSED auction trees separate so partners can drill either consistently.

  Produce all requested outputs and coverage below. Be concrete: full legal
  auctions, exact hand diagrams, call-by-call meanings, justified final contracts,
  failed alternatives, safe stops and a concise partnership memory card.
  Do not claim simulation, table validation or double-dummy analysis was run
  unless you actually ran it and report the inputs, tool and results.

