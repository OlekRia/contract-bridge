worked_example_format:
  - "ID, coverage tags, scoring, vulnerability, dealer and passed-hand status"
  - "Exact opener/responder cards; independently verified HCP and S-H-D-C shape"
  - "Opening eligibility and what each hand knows before the first response"
  - "First suspicion of slam and the information still needed"
  - "Complete CURRENT auction, or exact gap where it stops"
  - "Separate complete PROPOSED auction when a new agreement is required"
  - "Every call: meaning, lengths, strength, NF/F1/GF status and source/status label"
  - "Exact fit-setting bid, control inferences and remaining uncertainty"
  - "Pre-ask safety check, keycards/trump queen and legal stopping places"
  - "Final contract with twelve/thirteen-trick plan or concrete reason to stop"
  - "One plausible wrong turn, its cost, and why the recommended action improves it"
  - "Sensitivity to a changed honour, shortness, trump holding, lead or adverse break"
  - "Evidence level: hand reasoning, conditional probability, actual simulation or actual DD"

deliverables:
  - "Opening-by-opening roadmap with the 1♣/1♦ chapter fully developed"
  - "Source-grounded system audit, precedence resolutions and remaining gaps"
  - "Separate 1♣ and 1♦ response maps and continuation trees"
  - "Discovery framework from first response through safe stop, small slam and grand slam"
  - "Method comparison and the smallest coherent proposed improvement package"
  - "Club/diamond RKCB safety tables and contextual 4NT meaning table"
  - "At least 28 worked examples meeting the coverage counts, including all seed deals"
  - "At least four controlled comparisons and eight justified decisions against slam"
  - "Twelve bidding quizzes with answers kept separate, including meaning/forcing-status traps"
  - "One-page partnership memory card separating CURRENT agreements from proposals"
  - "Validation plan and proposed governance cascade for each recommended change"

validation:
  hand_integrity: >-
    Check thirteen cards per player, valid unique ranks per suit, no shared card
    between partners, exact HCP, stated shape and opening eligibility. Complete
    deals must contain every card exactly once and forty total HCP.
  auction_integrity: >-
    Every non-pass call must outrank the preceding contract; players alternate;
    opponents pass. Check length, strength, seat and forcing status at each call.
    Below-game pass is illegal under a continuing GF; game-level signoff, declined
    quantitative 4NT and terminal passes must be explicitly intelligible.
  knowledge_integrity: >-
    Explain a bid from that player's cards and disclosed information only.
    Full partnership cards are for teaching and checking, not bidding clairvoyance.
    Do not infer an unshown singleton, side king, queen or missing ace location.
  evaluation_integrity: >-
    Separate winning on a chosen layout, DD-makeability and a sound percentage
    contract. With only two hands, state lead, split and finesse dependencies.
    Analyse known bad controls before asking for aces; check tricks after keycards.
  experiment: >-
    Specify a stratified comparison of current methods against one proposed
    change at a time, with reproducible deal-generation constraints and seeds.
    Measure missed worthwhile slams, poor slams bid, correct rejections, wrong
    strains, unsafe asks, unresolved auctions, memory errors and scoring outcome.
    Keep unresolved current auctions visible rather than giving the baseline
    invented agreements. Predeclare success criteria and separate training from
